name: Build and release theme ZIPs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate theme.json files
        run: |
          for t in nova-business educalite newsline ember-oak juniper-house forge-studio wag-stay haven-estates vitalia-clinic evermore-weddings kindred-foundation sterling-cole; do
            echo "== $t theme.json =="
            python3 -m json.tool themes/$t/theme.json > /dev/null
            for s in themes/$t/styles/*.json; do echo "-- $s"; python3 -m json.tool "$s" > /dev/null; done
          done
      - name: Build ZIPs
        run: |
          mkdir -p dist
          for t in nova-business educalite newsline ember-oak juniper-house forge-studio wag-stay haven-estates vitalia-clinic evermore-weddings kindred-foundation sterling-cole; do
            (cd themes && zip -r ../dist/$t.zip $t -x "*.DS_Store*")
          done
          ls -lh dist/
          for z in dist/*.zip; do echo "--- $z"; unzip -l "$z" | head -n 12; done
      - uses: actions/upload-artifact@v4
        with:
          name: theme-zips
          path: dist/*.zip
      - name: Attach ZIPs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --generate-notes dist/*.zip
